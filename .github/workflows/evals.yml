name: motion-forge regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Secret scan (keys, tokens, .env files, personal paths)
        run: node skills/motion-forge/scripts/secret-scan.mjs .
      - name: Syntax check every script and the runtime
        run: for f in skills/motion-forge/scripts/*.mjs skills/motion-forge/scripts/lib/*.mjs skills/motion-forge/runtime/*.js; do node --check "$f" || exit 1; done
      - name: Plugin manifests are valid JSON
        run: node -e "for (const f of ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
  evals:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Playwright + Chromium
        run: npm i -g playwright@1.56 && npx playwright install --with-deps chromium
      - name: Optional libraries for the Three.js / GSAP cases
        run: mkdir -p /tmp/mflibs && cd /tmp/mflibs && npm init -y >/dev/null && npm i three gsap
      - name: Run deterministic eval harness (quick)
        env: { MF_NODE_PATH: /tmp/mflibs, MF_HOME: /tmp/mfhome }
        run: node skills/motion-forge/scripts/run-evals.mjs --work /tmp/mf-evals
      - name: Upload results + contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-forge-evals
          path: |
            /tmp/mf-evals/results.json
            /tmp/mf-evals/**/contact-sheet.png
