<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="brand.css"><!-- brand kit overrides (scaffold --brand / brand.mjs apply) -->
<style>
  /* industrial / architectural: a field of monoliths under raking light; one row carries the signal colour. 1u = 1% of height */
  :root { --u: calc({{HEIGHT}} * 1px / 100); --bone: var(--mf-ink, #E6E0D3); --mute: var(--mf-mute, #8C877C); --signal: var(--mf-signal, #E0421C); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; background: #16171A; color: var(--bone); font-family: var(--mf-font-display, "MF Display"), sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
  .hud { position: absolute; inset: calc(var(--u) * 6) calc(var(--u) * 9.5); pointer-events: none; }
  .label { position: absolute; font-family: var(--mf-font-text, "MF Text"), sans-serif; font-size: calc(var(--u) * 1.6); letter-spacing: 0.09em; text-transform: uppercase; font-feature-settings: "tnum" 1; }
  .label .dim { color: var(--mute); }
  .title { position: absolute; left: 0; top: calc(var(--u) * 9); margin: 0; font-weight: 500; font-size: calc(var(--u) * 9); line-height: 0.96; letter-spacing: -0.04em; }
  .title em { font-family: var(--mf-font-serif, "MF Serif"), serif; font-weight: 400; color: var(--signal); }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="stage">
  <div class="hud">
    <div class="label" id="lblA" style="left:0; top:0">Section 02 <span class="dim">— Structure</span></div>
    <div class="label" id="lblB" style="right:0; top:0"><span class="dim">Units</span> <span id="units">000</span></div>
    <h1 class="title" id="title" data-mf-text>Built to<br><em>carry weight.</em></h1>
  </div>
</div>
<script src="mf-runtime.js"></script>
<script type="module">
import * as THREE from "three";
const W = {{WIDTH}}, H = {{HEIGHT}}, DUR = {{DURATION}};
const COLS = 30, ROWS = 18, GAP = 1.15, N = COLS * ROWS, SIGNAL_ROW = 11;

// ---- renderer: deterministic, color-managed, DPR clamped, buffer preserved for frame capture
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: "high-performance" });
renderer.setPixelRatio(MF.pixelRatio(2));   // ?q=draft in preview → half resolution for fast scrubbing
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById("stage").prepend(renderer.domElement);
renderer.domElement.addEventListener("webglcontextlost", (e) => { e.preventDefault(); renderer.domElement.__mfContextLost = true; });

const scene = new THREE.Scene();
const BG = new THREE.Color("#16171A");
scene.background = BG;
scene.fog = new THREE.Fog(BG, 24, 58);                       // fog = background: depth without a horizon line

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 120);   // long lens: architectural, low distortion

// ---- light: low raking key (long shadows), cool sky fill, faint rim for silhouette separation
scene.add(new THREE.HemisphereLight("#9DA6B5", "#1A1A1C", 0.55));
const key = new THREE.DirectionalLight("#FFE9CF", 2.6);
key.position.set(-14, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -22, right: 22, top: 16, bottom: -16, near: 1, far: 60 });
key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.DirectionalLight("#B7C4FF", 0.6); rim.position.set(10, 4, -12); scene.add(rim);

// ---- geometry: one instanced mesh (1 draw call for N monoliths) + ground
const geo = new THREE.BoxGeometry(0.82, 1, 0.82); geo.translate(0, 0.5, 0);
const mat = new THREE.MeshStandardMaterial({ color: MF.cssColor("--bone", "#E6E0D3"), roughness: 0.82, metalness: 0.0 });   // brand kit: --mf-ink
const mesh = new THREE.InstancedMesh(geo, mat, N);
mesh.castShadow = mesh.receiveShadow = true;
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(mesh);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshStandardMaterial({ color: "#1C1D21", roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// deterministic layout + heights (seeded, never Math.random)
const rnd = MF.rng(7);
const cells = [];
const signal = new THREE.Color(MF.cssColor("--signal", "#E0421C")), bone = new THREE.Color(MF.cssColor("--bone", "#E6E0D3"));   // follow the brand kit
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const x = (c - (COLS - 1) / 2) * GAP, z = (r - (ROWS - 1) / 2) * GAP;
  const ridge = Math.exp(-Math.pow((c - COLS * 0.64 + r * 0.45) / 4.2, 2));        // one ridge = one compositional diagonal
  const h = r === SIGNAL_ROW ? 1.1 + ridge * 2.2 : 0.18 + ridge * 3.4 + rnd() * 0.55 * (0.25 + ridge);   // signal row reads as a single wall
  const i = cells.length; cells.push({ x, z, h, delay: (c / COLS) * 0.9 + rnd() * 0.25, row: r });
  mesh.setColorAt(i, r === SIGNAL_ROW ? signal : bone);
}
mesh.instanceColor.needsUpdate = true;
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();

// ---- motion plan (shared deterministic timeline drives camera + growth + type)
const state = { grow: 0, camZ: 36, camY: 21, camX: -15, lookX: -6, signal: 0 };
const tl = MF.timeline();
let titleWords;
MF.compose({
  width: W, height: H, fps: {{FPS}}, duration: DUR, title: "{{TITLE}}",
  setup() {
    titleWords = MF.split("#title", { by: "words" });
    const E = MF.tokens.ease;
    tl.addLabel("rise", 0)
      .fromTo(state, { grow: 0 }, { grow: 1, duration: 3.4, ease: "power2.inOut" }, 0.1)
      .fromTo(state, { camZ: 36, camY: 21, camX: -15 }, { camZ: 31, camY: 12.5, camX: -6, duration: DUR, ease: "cubic(0.45,0,0.25,1)" }, 0)  // one continuous dolly + crane down
      .fromTo(state, { lookX: -6 }, { lookX: -4, duration: DUR, ease: E.soft }, 0)   // aim left of the field: it sits right, sky holds the type
      .fromTo(["#lblA", "#lblB"], { opacity: 0, y: H * 0.01 }, { opacity: 1, y: 0, duration: 0.6, ease: E.enter, stagger: 0.12 }, 0.8)
      .addLabel("signal", 3.6)
      .fromTo(state, { signal: 0 }, { signal: 1, duration: 1.2, ease: E.move }, "signal")
      .fromTo(titleWords, { yPercent: 108 }, { yPercent: 0, duration: 1.0, ease: E.enter, stagger: 0.12 }, "signal+=0.5")
      .to({}, { duration: 3.5, onUpdate: (e) => { document.getElementById("units").textContent = String(Math.round(N * e)).padStart(3, "0"); } }, 0.1);
  },
  timeline: tl,
  render(t) {
    for (let i = 0; i < N; i++) {
      const cl = cells[i];
      const g = MF.clamp((state.grow * 1.25 - cl.delay * 0.55) / 0.7, 0, 1);
      const e = MF.ease("expo.out")(g);
      const lift = cl.row === SIGNAL_ROW ? 1 + 0.35 * MF.ease("back.out(1.3)")(state.signal) : 1;
      s.set(1, Math.max(0.001, cl.h * e * lift), 1); p.set(cl.x, 0, cl.z);
      mesh.setMatrixAt(i, m4.compose(p, q, s));
    }
    mesh.instanceMatrix.needsUpdate = true;
    camera.position.set(state.camX, state.camY, state.camZ);
    camera.lookAt(state.lookX, 2.6, 2);
    renderer.render(scene, camera);
  },
  stats: () => ({ drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles,
    geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures, pixelRatio: renderer.getPixelRatio() })
});
// lifecycle hygiene: free GPU resources when the page goes away
addEventListener("pagehide", () => { geo.dispose(); mat.dispose(); ground.geometry.dispose(); ground.material.dispose(); renderer.dispose(); });
</script>
</body>
</html>
