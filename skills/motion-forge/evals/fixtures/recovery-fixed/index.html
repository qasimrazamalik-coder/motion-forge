<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launch teaser (reference repair)</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* EVAL F reference repair. Each fix is minimal and named: see evals/README.md → "Eval F defects". */
  :root { --u: calc(1080px / 100); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; background: #101418; color: #F2EFE8; font-family: "MF Display", sans-serif; }
  .hero { position: absolute; left: calc(var(--u) * 8); top: calc(var(--u) * 34); margin: 0; font-family: "MF Display", sans-serif; font-weight: 700;   /* fix 2: unlicensed/unloaded face → bundled OFL display face */
    font-size: calc(var(--u) * 9.5); letter-spacing: -0.04em; line-height: 0.98; width: calc(var(--u) * 92); text-wrap: balance; }   /* fix 7: wraps inside the frame */
  .shot { position: absolute; right: calc(var(--u) * 8); top: calc(var(--u) * 12); width: calc(var(--u) * 40); height: calc(var(--u) * 26); border-radius: calc(var(--u) * 1.2);
    background: linear-gradient(160deg, #26303A, #18202A); box-shadow: inset 0 0 0 1px #2E3944; }   /* fix 3: missing PNG → explicit placeholder card (ask for the real asset) */
  .dot { position: absolute; width: calc(var(--u) * 2); height: calc(var(--u) * 2); border-radius: 50%; background: #E0421C; left: 50%; top: 80%; }
</style>
</head>
<body>
<div id="stage">
  <h1 class="hero" id="hero">Introducing the fastest close in finance</h1>
  <div class="shot" id="shot" role="img" aria-label="product placeholder"></div>
  <div class="dot" id="dot"></div>
</div>
<script src="mf-runtime.js"></script>
<script>
const tl = MF.timeline();
const items = [];                                         // empty on purpose
const spacing = items.length ? 1920 / items.length : 0;  // fix 4: guard empty list (was Infinity → NaN)
MF.compose({
  width: 1920, height: 1080, fps: 30, duration: 6,
  setup() {
    tl.fromTo("#hero", { x: -200, opacity: 0 }, { x: 0, opacity: 1, duration: 1.2, ease: "expo.out" }, 0.3)
      .fromTo("#shot", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: "power3.out" }, 0.8)
      .to("#dot", { x: spacing * 0, duration: 1.5, ease: "sine.inOut" }, 2)
      .to("#hero", { scale: 1.06, duration: 3, ease: "none" }, 2.5);
  },
  render(t) {
    // fix 5: seeded, time-indexed jitter (same t → same pixels); fix 1: removed undefined __dbg counter
    document.getElementById("dot").style.marginLeft = (MF.rng(Math.floor(t * 30) + 1)() * 6).toFixed(2) + "px";
  },
  timeline: tl                                               // fix 6: timeline wired into the render contract
});
</script>
</body>
</html>
